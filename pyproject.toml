[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qinyuan-agent"
version = "0.1.0"
description = "面向 CTF 与授权安全实验的双 LLM Agent：外层规划审核，内层执行，Docker Sandbox 中运行工具并留存证据。"
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "Autyui"}]
requires-python = ">=3.11,<3.14"
dependencies = [
    "docker>=7.1,<8",
    "langchain-core>=0.3,<2",
    "langchain-openai>=0.3,<2",
    "mcp[cli]>=1.9,<2",
    "pydantic>=2.7,<3",
    "python-dotenv>=1,<2",
]

classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/Xushu-Zhihe/Qinyuan_Agent_new"

[project.scripts]
qinyuan-agent = "agent:main"
qinyuan-agent-new = "agent:main"
qinyuan-workbench = "agent_adapters.workbench:main"

[tool.setuptools]
include-package-data = true
py-modules = ["agent"]

[tool.setuptools.packages.find]
where = ["."]
include = ["Agents*", "LLMs*", "MCPs*", "Sandbox*", "Skills*", "tools*", "agent_core*", "agent_adapters*", "qinyuan_core*", "frontend*"]
exclude = ["MCPs.Dirsearch_Mcp.test*"]

[tool.setuptools.package-data]
agent_adapters = ["*.ps1"]
Skills = ["**/*.md", "**/*.py", "**/*.json"]
"MCPs.Mcp_client" = ["registry.json"]
"MCPs.LibcSearcher_Mcp" = ["database.json"]
frontend = ["*.html", "*.js", "*.css"]

[tool.uv]
package = true
cache-dir = ".test/uv-cache"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = ".test/pytest-cache"
# 默认跳过需要 Docker / 真实网络的用例（tests/conftest.py 里按模块打 live 标记）。
# 需要时：pytest -m live（只跑 live）、pytest -m ""（全量）。
# 默认跳过 live（需要 Docker / 真实网络）与 slow（端到端拉起 CLI 子进程）。
# pytest -m smoke（日常）/ -m slow / -m live / -m ""（全量）
addopts = "-m 'not live and not slow'"
# 不再指定 --basetemp：默认落在系统临时目录，pytest 自动回收，
# 仓库里不会因为跑一次测试就多出上百 MB 产物。

[tool.ruff]
cache-dir = ".test/ruff-cache"
extend-exclude = [".test"]

[tool.mypy]
cache_dir = ".test/mypy-cache"
exclude = ['^\.test/']

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
